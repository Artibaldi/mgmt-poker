<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Управленческий покер — комната</title>
<style>
:root {
  --felt: #123f31; --felt-deep: #0b2b21; --felt-line: #1e5a46;
  --ivory: #f5efe0; --ivory-edge: #e4dac3; --ink: #1f1b16; --ink-soft: #5b5348;
  --brass: #c19a53; --brass-soft: #8c7040; --garnet: #8f2a37;
  --ok: #3f7d5a; --warn: #b7832f; --gap: #a8323f; --text-soft: #cfc6b0; --text-dim: #9fb5aa;
  --radius: 14px;
  --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; color: var(--ivory); font: 15px/1.5 var(--sans);
  background: radial-gradient(ellipse at 50% 30%, var(--felt) 0%, var(--felt-deep) 75%) fixed, var(--felt-deep); }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--felt-line); padding-bottom: 12px; }
.brand b { display: block; font: 700 20px var(--serif); color: var(--brass); }
.brand span { color: var(--text-soft); font: 13px var(--serif); }
.who { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--text-soft); }
.dot-on, .dot-off { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.dot-on { background: #6fd39a; } .dot-off { background: #50645b; }
.rec { color: #ff8f8f; font-weight: 600; }
.btn { border: 1px solid var(--brass-soft); background: transparent; color: var(--ivory); padding: 7px 14px; border-radius: 999px; }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--ink); font-weight: 600; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; color: var(--text-soft); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.banner { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--warn); background: rgba(183,131,47,.18); }
.dots { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 4px; align-items: center; }
.dots .theme { margin-right: 8px; color: var(--brass); font: 600 14px var(--serif); }
.dot { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--felt-line); background: rgba(0,0,0,.15);
  color: var(--text-dim); display: grid; place-items: center; font-size: 15px; padding: 0; }
.dot.done { background: var(--ivory); color: var(--ink); border-color: var(--ivory-edge); }
.dot.red { color: #e07f8b; } .dot.done.red { color: var(--garnet); }
.dot.cur { outline: 2px solid var(--brass); outline-offset: 2px; }
.dot.off { opacity: .4; text-decoration: line-through; }
.stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; margin-top: 16px; }
@media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }
.card { position: relative; background: var(--ivory); color: var(--ink); border-radius: var(--radius);
  border: 1px solid var(--ivory-edge); padding: 22px 24px 20px 64px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.card.red .pip, .card.red .comp { color: var(--garnet); }
.pip { position: absolute; left: 20px; top: 16px; font-size: 30px; line-height: 1; text-align: center; }
.pip small { display: block; font: 600 11px var(--sans); margin-top: 4px; color: var(--ink-soft); }
.kind { display: inline-block; font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase;
  color: var(--brass-soft); border: 1px solid #d9c9a6; border-radius: 999px; padding: 2px 8px; margin-bottom: 8px; }
.comp { font: 600 14px var(--sans); letter-spacing: .05em; text-transform: uppercase; }
.desc { color: var(--ink-soft); font-size: 13px; margin: 2px 0 12px; }
.fact { font: 17px/1.55 var(--serif); margin: 0 0 14px; }
.nofact { font: italic 15px/1.5 var(--serif); color: var(--ink-soft); margin: 0 0 14px; }
.q { border-top: 1px dashed #cdbf9f; padding-top: 12px; font: italic 17px/1.5 var(--serif); }
.lbl { display: block; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--brass-soft); font-style: normal; margin-bottom: 4px; }
.src { margin-top: 10px; font-size: 12px; color: var(--ink-soft); }
.anchors { margin-top: 14px; border-top: 1px dashed #cdbf9f; padding-top: 10px; display: grid; gap: 6px; }
.anchors div { display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.anchors b { font: 700 15px var(--serif); color: var(--ink); text-align: center; }
.after { margin-top: 14px; border-top: 1px dashed #cdbf9f; padding-top: 10px; font-size: 14px; }
.after ul { margin: 4px 0 0; padding-left: 18px; }
.side { display: flex; flex-direction: column; gap: 14px; }
.panel { border: 1px solid var(--felt-line); border-radius: var(--radius); padding: 14px; background: rgba(0,0,0,.18); }
.panel h3 { margin: 0 0 8px; font: 600 14px var(--sans); color: var(--brass); }
.status { font-size: 13px; color: var(--text-soft); }
.chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 0; }
.chip { border: 1px solid var(--brass-soft); background: var(--felt-deep); color: var(--ivory); border-radius: 10px; padding: 10px 0; font: 600 17px var(--serif); }
.chip.sel { background: var(--brass); color: var(--ink); border-color: var(--brass); }
textarea, input[type=text], input[type=date] { width: 100%; border-radius: 10px; border: 1px solid var(--felt-line);
  background: rgba(0,0,0,.25); color: var(--ivory); padding: 9px 10px; }
textarea { min-height: 70px; resize: vertical; }
textarea::placeholder, input::placeholder { color: #8fa79b; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.facedown { display: grid; place-items: center; min-height: 90px; border-radius: 10px; color: var(--brass); text-align: center;
  background: repeating-linear-gradient(45deg, #5a1d26 0 6px, #6c2430 6px 12px); border: 2px solid var(--brass-soft); padding: 8px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.faceup { background: var(--ivory); color: var(--ink); border-radius: 10px; padding: 10px; }
.faceup .v { font: 700 36px var(--serif); text-align: center; }
.faceup .n { font: 600 12px var(--sans); color: var(--brass-soft); text-align: center; }
.faceup .w { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
.verdict { border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.verdict.same { background: rgba(63,125,90,.25); border: 1px solid var(--ok); }
.verdict.near { background: rgba(183,131,47,.2); border: 1px solid var(--warn); }
.verdict.gap { background: rgba(168,50,63,.25); border: 1px solid var(--gap); }
.verdict small { display: block; font-weight: 400; color: #ddd3bd; }
.draft { background: rgba(245,239,224,.08); border-radius: 10px; padding: 10px; margin: 8px 0; }
.ok { color: #8fe0ad; }
.nav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.center { max-width: 640px; margin: 40px auto; }
.paper { background: var(--ivory); color: var(--ink); border-radius: var(--radius); padding: 24px; }
.paper h2 { margin: 0 0 8px; font: 700 22px var(--serif); }
.paper ol { padding-left: 20px; } .paper li { margin: 4px 0; }
.summary h2 { font: 600 20px var(--serif); color: var(--brass); margin: 24px 0 8px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--felt-line); vertical-align: top; }
th { color: var(--brass); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
td.num { font: 600 16px var(--serif); white-space: nowrap; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--garnet); color: #fff;
  padding: 10px 16px; border-radius: 10px; max-width: 90vw; }
[hidden] { display: none !important; }
@media print {
  body { background: #fff; color: #000; }
  header .who, .noprint, .toast { display: none !important; }
  .summary h2, th { color: #000; }
  th, td { border-color: #bbb; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>Управленческий покер</b><span id="sub">комната</span></div>
    <div class="who" id="who"></div>
  </header>
  <div id="banner"></div>
  <main id="main"><div class="center"><p>Подключаемся…</p></div></main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/static/core.js"></script>
<script>
"use strict";
const P = window.PokerCore;
const F = new URLSearchParams(location.hash.slice(1));
const ROLE = F.get("role"), TOKEN = F.get("t"), HALF = F.get("k"), NAME = F.get("n") || "";
const OTHER = ROLE === "host" ? "guest" : "host";
const ROOM = location.pathname.split("/").filter(Boolean)[1];
const SUITS_ORDER = ["♠", "♦", "♣", "♥"];
const KIND_DEFAULT = { fact: "Факт из Jira", behavior: "Поведенческий вопрос", followup: "Проверка договорённости" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const red = (s) => s === "♥" || s === "♦";
const roleName = (r) => (S.players[r] && S.players[r].name) || (r === "host" ? "Руководитель" : "Сотрудник");

let events = [], S = P.reduce([]), deck = null, sending = false, helloSent = false, deckError = null;
const form = {}; // черновики полей ввода, чтобы перерисовка их не стирала
const mem = {};

function store(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function recall(k) { if (mem[k]) return mem[k]; try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
const voteKey = (card) => `poker:${ROOM}:${ROLE}:${card}`;

function toast(text) { const t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 4000); }

async function api(path, opts = {}) {
  const r = await fetch(`/api/r/${ROOM}/${path}`, Object.assign({ headers: { "X-Poker-Token": TOKEN, "Content-Type": "application/json" } }, opts));
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
  return body;
}
async function post(type, data = {}) {
  try { await api("events", { method: "POST", body: JSON.stringify({ type, data }) }); }
  catch (e) { toast(e.message); }
}

async function poll() {
  let first = true;
  for (;;) {
    try {
      const r = await api(`events?since=${events.length}&wait=${first ? 0 : 1}`);
      if (r.events.length) { events = events.concat(r.events); S = P.reduce(events); }
      if (r.events.length || first) { first = false; await onState(); render(); }
    } catch (e) {
      toast("Связь с комнатой: " + e.message);
      if (/недействительна|не найдена|истёк/.test(e.message)) return fatal(e.message);
      await new Promise((ok) => setTimeout(ok, 3000));
    }
  }
}

async function onState() {
  if (!S.players[ROLE].half && !helloSent) { helloSent = true; await post("hello", { name: NAME, half: HALF }); }
  if (!deck && S.players.host.half && S.players.guest.half) {
    try {
      const blob = await api("deck");
      deck = P.unseal(blob, P.keyFromHalves(S.players.host.half, S.players.guest.half));
    } catch (e) { deckError = e.message; }
  }
  if (!deck) return;
  for (const c of deck.cards) {           // вскрытие: как только печати положили оба
    const st = S.cards[c.id];
    if (st && st.commits.host && st.commits.guest && !st.reveals[ROLE]) {
      const mine = recall(voteKey(c.id));
      if (mine && !mine.sent) { mine.sent = true; store(voteKey(c.id), mine); await post("reveal", { card: c.id, vote: mine.vote, why: mine.why, salt: mine.salt }); }
    }
  }
}

function fatal(text) { $("main").innerHTML = `<div class="center"><div class="paper"><h2>Комната недоступна</h2><p>${esc(text)}</p></div></div>`; }

// ---------------- рендер ----------------
function render() {
  const focus = document.activeElement && document.activeElement.id, sel = focus && document.activeElement.selectionStart;
  renderHeader();
  if (!deck || S.phase === "lobby") renderLobby();
  else if (S.phase === "play") renderPlay();
  else renderSummary();
  if (focus && $(focus)) { $(focus).focus(); try { $(focus).setSelectionRange(sel, sel); } catch (e) {} }
}

function renderHeader() {
  const p = (r) => `<span><i class="${S.players[r].joinedAt ? "dot-on" : "dot-off"}"></i>${esc(roleName(r))}${r === ROLE ? " (вы)" : ""}</span>`;
  let rec = "";
  if (S.rec) rec = `<span class="rec">● запись идёт · таймкоды от ${new Date(S.rec).toLocaleTimeString("ru-RU")}</span>`;
  else if (ROLE === "host" && deck) rec = `<button class="btn small noprint" data-act="rec">● Отметить начало записи ВКС</button>`;
  const pause = ROLE === "guest" && S.phase === "play" ? `<button class="btn small noprint" data-act="pause">${S.pause ? "Продолжить" : "Пауза"}</button>` : "";
  $("who").innerHTML = p("host") + p("guest") + rec + pause;
  if (deck) $("sub").textContent = `${deck.meta.person} · ${deck.meta.role_title} · ${deck.meta.period}`;
  let b = "";
  if (S.pause) b += `<div class="banner">⏸ ${esc(roleName(S.pause.role))} просит паузу.</div>`;
  if (S.back && ROLE === "host") b += `<div class="banner">↩ ${esc(roleName("guest"))} просит вернуться к карте ${S.back.card + 1}. <button class="btn small" data-act="nav" data-card="${S.back.card}">Вернуться</button></div>`;
  $("banner").innerHTML = b;
}

function renderLobby() {
  const both = S.players.host.joinedAt && S.players.guest.joinedAt;
  if (!deck) {
    $("main").innerHTML = `<div class="center"><div class="paper"><h2>${both ? "Открываем колоду…" : "Ждём второго участника"}</h2>
      <p>Колода запечатана: в каждой ссылке — половина ключа. Карты не видел никто, они откроются, когда в комнате будут оба.</p>
      ${deckError ? `<p><b>Не удалось открыть колоду:</b> ${esc(deckError)}</p>` : ""}
      <p class="status">${esc(roleName("host"))}: ${S.players.host.joinedAt ? "в комнате" : "не в комнате"} · ${esc(roleName("guest"))}: ${S.players.guest.joinedAt ? "в комнате" : "не в комнате"}</p></div></div>`;
    return;
  }
  const meReady = S.players[ROLE].ready, otherReady = S.players[OTHER].ready;
  const counts = SUITS_ORDER.map((s) => [s, deck.cards.filter((c) => c.suit === s).length]).filter(([, n]) => n);
  $("main").innerHTML = `<div class="center"><div class="paper">
    <h2>Перед раздачей</h2>
    <p>${esc(deck.meta.person)} · ${esc(deck.meta.role_title)} · период ${esc(deck.meta.period)} · карт: ${deck.cards.length}
      (${counts.map(([s, n]) => `${s} ${esc(deck.meta.suits[s])} — ${n}`).join("; ")}).</p>
    <ol>
      <li>Это не аттестация. Итоги видят только двое, выгрузить их может каждый.</li>
      <li>Карту читают оба. Если факт неточен — отметьте это, оценивать по неверному факту не нужно.</li>
      <li>Каждый ставит оценку <b>на своём экране</b> и пишет одно предложение «почему». Оценка уходит запечатанной — второй её не видит.</li>
      <li>Когда положили оба — вскрытие: две оценки, разница и «что показывают данные».</li>
      <li>Разговор о разнице; договорённость принимается, когда её подтвердили оба.</li>
    </ol>
    <p class="status" style="color:var(--ink-soft)">Шкала: ${Object.entries(deck.meta.scale).map(([k, v]) => `<b>${k}</b> ${esc(v)}`).join(" · ")} · <b>?</b> не знаю — нужен разговор</p>
    <button class="btn primary" data-act="ready" ${meReady ? "disabled" : ""}>${meReady ? "Вы готовы" : "Готов"}</button>
    <span class="status" style="color:var(--ink-soft);margin-left:10px">${esc(roleName(OTHER))}: ${otherReady ? "готовность подтверждена" : "читает правила"}</span>
  </div></div>`;
}

function themeOf(c) { return deck.meta.suits[c.suit] || c.suit; }

function renderPlay() {
  const i = Math.min(S.cur, deck.cards.length - 1), c = deck.cards[i], st = S.cards[c.id] || { read: {}, commits: {}, reveals: {}, drafts: [], agreed: {} };
  const dots = deck.cards.map((x, j) => {
    const s = S.cards[x.id];
    return `<button class="dot ${P.cardDone(s) ? "done" : ""} ${red(x.suit) ? "red" : ""} ${j === i ? "cur" : ""} ${s && s.dropped ? "off" : ""}" ${ROLE === "host" ? `data-act="nav" data-card="${j}"` : "disabled"} title="${esc(x.title)}">${x.suit}</button>`;
  }).join("");
  const revealed = !!st.revealedAt;
  $("main").innerHTML = `
    <div class="dots"><span class="theme">${c.suit} ${esc(themeOf(c))}</span>${dots}</div>
    <div class="stage">
      <article class="card ${red(c.suit) ? "red" : ""}">
        <div class="pip">${c.suit}<small>${i + 1}/${deck.cards.length}</small></div>
        <span class="kind">${esc(c.kind_title || KIND_DEFAULT[c.kind])}</span>
        <div class="comp">${esc(c.title)}</div>
        <div class="desc">${esc(c.description || "")}</div>
        ${c.fact ? `<p class="fact">${esc(c.fact)}</p>` : `<p class="nofact">Данных Jira по этой компетенции за период нет — вспомните примеры сами.</p>`}
        <div class="q"><span class="lbl">Вопрос для оценки</span>${esc(c.question)}</div>
        ${c.source ? `<div class="src">Источник: ${esc(c.source)}</div>` : ""}
        <div class="anchors"><span class="lbl">Как выглядит каждый уровень</span>
          ${Object.entries(c.anchors || {}).map(([k, v]) => `<div><b>${k}</b><span>${esc(v)}</span></div>`).join("")}</div>
        ${revealed ? `<div class="after"><span class="lbl">Что показывают данные</span>${esc(c.data_view || "—")}
          ${(c.discussion || []).length ? `<span class="lbl" style="margin-top:10px">Вопросы для разговора</span><ul>${c.discussion.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>` : ""}</div>` : ""}
      </article>
      <div class="side">${st.dropped ? `<div class="panel"><h3>Карта снята ведущим</h3><p class="status">Её не оцениваем.</p></div>` : sidePanels(c, st)}
        ${navPanel(i)}</div>
    </div>`;
}

function otherStatus(st) {
  if (st.commits[OTHER]) return "карта положена ✓";
  if (st.read[OTHER]) return "карта прочитана, идёт оценка";
  return "читает";
}

function sidePanels(c, st) {
  let h = "";
  if (st.flag) h += `<div class="banner" style="margin:0">⚠️ ${esc(roleName(st.flag.role))}: факт неточен${st.flag.text ? ` — «${esc(st.flag.text)}»` : ""}</div>`;
  if (!st.read[ROLE]) {
    const k = `flag-${c.id}`;
    return h + `<div class="panel"><h3>Шаг 1. Прочитайте карту</h3>
      <p class="status">${esc(roleName(OTHER))}: ${otherStatus(st)}</p>
      <button class="btn primary" data-act="read" data-card="${c.id}">Прочитал</button>
      <details style="margin-top:10px"><summary class="status">Факт неточен или неполный</summary>
        <textarea id="${k}" data-form="${k}" placeholder="Что не так с фактом или какого контекста не хватает">${esc(form[k] || "")}</textarea>
        <button class="btn small" style="margin-top:6px" data-act="flag" data-card="${c.id}">Отметить и продолжить</button></details></div>`;
  }
  if (!st.revealedAt) {
    if (!st.commits[ROLE]) {
      const vk = `vote-${c.id}`, wk = `why-${c.id}`, v = form[vk];
      return h + `<div class="panel"><h3>Шаг 2. Ваша оценка — вслепую</h3>
        <p class="status">${esc(roleName(OTHER))}: ${otherStatus(st)}</p>
        <div class="chips">${P.STEPS.concat(["?"]).map((x) => `<button class="chip ${v === x ? "sel" : ""}" data-act="pick" data-card="${c.id}" data-val="${x}">${x}</button>`).join("")}</div>
        <textarea id="${wk}" data-form="${wk}" placeholder="Почему так — одно предложение, с примером">${esc(form[wk] || "")}</textarea>
        <button class="btn primary" style="margin-top:8px" data-act="commit" data-card="${c.id}" ${v != null && (form[wk] || "").trim().length >= 3 ? "" : "disabled"}>Положить карту рубашкой вверх</button>
        <p class="status">Оценка уходит запечатанной: до вскрытия её не видит ни второй игрок, ни сервер.</p></div>`;
    }
    return h + `<div class="panel"><h3>Ждём вскрытия</h3><div class="facedown">Ваша карта положена рубашкой вверх</div>
      <p class="status">${esc(roleName(OTHER))}: ${otherStatus(st)}</p></div>`;
  }
  const v = st.reveals, d = P.delta(v.host.vote, v.guest.vote);
  const face = (r) => `<div class="faceup"><div class="n">${esc(roleName(r))}</div><div class="v">${esc(v[r].vote)}${v[r].ok ? "" : " ⚠️"}</div><div class="w">${esc(v[r].why)}</div></div>`;
  h += `<div class="panel"><h3>Вскрытие${S.rec ? ` · ${P.timecode(S, st.revealedAt)}` : ""}</h3><div class="duo">${face("host")}${face("guest")}</div>
    <div class="verdict ${d.kind}" style="margin-top:10px">${d.text}<small>${d.kind === "gap" ? "Первым говорит тот, кто оценил выше." : "Коротко сверьтесь и двигайтесь дальше."}</small></div></div>`;
  const last = st.drafts[st.drafts.length - 1], tk = `agr-${c.id}`, ok = `own-${c.id}`, dk = `due-${c.id}`;
  const agreed = last && st.agreed.host && st.agreed.guest;
  h += `<div class="panel"><h3>Шаг 3. Договорённость</h3>
    ${last ? `<div class="draft"><b>${esc(last.text)}</b>${last.owner ? ` — ${esc(last.owner)}` : ""}${last.due ? `, срок: ${esc(last.due)}` : ""}
      <div class="status">предложил(а) ${esc(roleName(last.role))} · ${esc(roleName("host"))}: ${st.agreed.host ? '<span class="ok">согласие ✓</span>' : "ещё нет"} · ${esc(roleName("guest"))}: ${st.agreed.guest ? '<span class="ok">согласие ✓</span>' : "ещё нет"}</div>
      ${!st.agreed[ROLE] ? `<button class="btn primary small" style="margin-top:6px" data-act="agree" data-card="${c.id}" data-draft="${last.seq}">Согласен</button>` : ""}</div>` : ""}
    ${agreed ? `<p class="ok">✓ Договорённость принята обоими.</p>` : ""}
    <textarea id="${tk}" data-form="${tk}" placeholder="Что делаем — или «держим как есть»">${esc(form[tk] != null ? form[tk] : (last ? last.text : ""))}</textarea>
    <div class="row"><input id="${ok}" data-form="${ok}" type="text" placeholder="Кто" value="${esc(form[ok] != null ? form[ok] : (last ? last.owner : ""))}">
      <input id="${dk}" data-form="${dk}" type="text" placeholder="К какому сроку" value="${esc(form[dk] != null ? form[dk] : (last ? last.due : ""))}"></div>
    <button class="btn small" style="margin-top:8px" data-act="draft" data-card="${c.id}">${last ? "Предложить другую формулировку" : "Предложить"}</button></div>`;
  return h;
}

function navPanel(i) {
  const last = i === deck.cards.length - 1;
  if (ROLE === "host") return `<div class="nav noprint">
      <button class="btn" data-act="nav" data-card="${i - 1}" ${i === 0 ? "disabled" : ""}>← Назад</button>
      <button class="btn ghost small" data-act="drop" data-card="${deck.cards[i].id}">Снять карту</button>
      <button class="btn ${last ? "primary" : ""}" data-act="nav" data-card="${last ? "summary" : i + 1}">${last ? "К итогам" : "Дальше →"}</button></div>`;
  return `<div class="nav noprint"><span class="status">Темп ведёт ${esc(roleName("host"))}.</span>
    ${i > 0 ? `<button class="btn small" data-act="back" data-card="${i - 1}">Попросить вернуться к прошлой карте</button>` : ""}</div>`;
}

function summaryData() {
  const covered = [], agreements = [], today = new Date().toISOString().slice(0, 10);
  for (const c of deck.cards) {
    const st = S.cards[c.id];
    if (st && st.revealedAt && !st.dropped) covered.push(c.competency);
    const a = P.agreement(st);
    if (a) agreements.push({ competency: c.competency, title: c.title, text: a.text, owner: a.owner, due: a.due, date: today });
  }
  return { covered, agreements, role: deck.meta.role };
}

function renderSummary() {
  const stats = P.suitStats(deck, S), closed = S.phase === "closed";
  const rows = deck.cards.map((c, j) => {
    const st = S.cards[c.id], v = st && st.revealedAt ? st.reveals : null, a = P.agreement(st);
    return `<tr><td>${j + 1}</td><td>${c.suit} ${esc(c.title)}${st && st.dropped ? " (снята)" : ""}</td><td class="num">${v ? esc(v.host.vote) : "·"}</td><td class="num">${v ? esc(v.guest.vote) : "·"}</td>
      <td>${v ? esc(P.delta(v.host.vote, v.guest.vote).text) : "—"}</td><td>${a ? esc(a.text) : "—"}</td><td>${v ? P.timecode(S, st.revealedAt) : ""}</td></tr>`;
  }).join("");
  $("main").innerHTML = `<section class="summary">
    <h2>Итоги${closed ? " — встреча закрыта" : ""}</h2>
    <div class="tablewrap"><table><tr><th>Масть</th><th>Карт</th><th>${esc(roleName("host"))}</th><th>${esc(roleName("guest"))}</th></tr>
      ${stats.map((x) => `<tr><td>${x.suit} ${esc(x.name)}</td><td>${x.n}</td><td class="num">${x.host}</td><td class="num">${x.guest}</td></tr>`).join("")}</table></div>
    <h2>Договорённости</h2>
    ${summaryData().agreements.length ? `<ul>${summaryData().agreements.map((a) => `<li><b>${esc(a.title)}:</b> ${esc(a.text)}${a.owner ? ` — ${esc(a.owner)}` : ""}${a.due ? `, срок: ${esc(a.due)}` : ""}</li>`).join("")}</ul>` : `<p class="status">Нет принятых договорённостей.</p>`}
    <h2>Все карты</h2>
    <div class="tablewrap"><table><tr><th>#</th><th>Карта</th><th>${esc(roleName("host"))}</th><th>${esc(roleName("guest"))}</th><th>Разница</th><th>Договорённость</th><th>Таймкод</th></tr>${rows}</table></div>
    <h2 class="noprint">Действия</h2>
    <div class="nav noprint" style="justify-content:flex-start">
      ${!closed ? `<button class="btn ${S.summaryOk[ROLE] ? "" : "primary"}" data-act="summary_ok" ${S.summaryOk[ROLE] ? "disabled" : ""}>${S.summaryOk[ROLE] ? "Вы подтвердили итоги" : "Итоги верны"}</button>
        <span class="status">${esc(roleName(OTHER))}: ${S.summaryOk[OTHER] ? "итоги подтверждены ✓" : "итоги ещё не подтверждены"}</span>` : ""}
      ${!closed && ROLE === "host" ? `<button class="btn" data-act="nav" data-card="${deck.cards.length - 1}">← К картам</button>
        <button class="btn primary" data-act="close" ${S.summaryOk.host && S.summaryOk.guest ? "" : "disabled"}>Закрыть встречу</button>` : ""}
      <button class="btn" data-act="export-md">Выгрузить .md</button>
      <button class="btn" data-act="export-pdf">PDF (печать)</button>
    </div>
    <p class="status noprint">Выгрузка одинаковая для обоих: ваши оценки и «почему», оценки второго игрока, данные и договорённости.</p>
  </section>`;
}

function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/markdown" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------------- действия ----------------
document.addEventListener("input", (e) => { const k = e.target.dataset.form; if (k) { form[k] = e.target.value; if (k.startsWith("why-")) renderPlayVoteButton(k); } });
function renderPlayVoteButton(k) {
  const card = k.slice(4), btn = document.querySelector(`[data-act="commit"][data-card="${card}"]`);
  if (btn) btn.disabled = !(form[`vote-${card}`] != null && (form[k] || "").trim().length >= 3);
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled || sending) return;
  const card = t.dataset.card != null && t.dataset.card !== "summary" ? +t.dataset.card : t.dataset.card;
  sending = true;
  try {
    switch (t.dataset.act) {
      case "ready": await post("ready"); break;
      case "rec": await post("rec"); break;
      case "pause": await post("pause", { on: !S.pause }); break;
      case "nav": await post("nav", { card }); break;
      case "back": await post("back", { card }); break;
      case "drop": if (confirm("Снять карту? Её не будут оценивать.")) await post("drop", { card }); break;
      case "read": await post("read", { card }); break;
      case "flag": await post("read", { card, flag: true, text: (form[`flag-${card}`] || "").trim() }); break;
      case "pick": form[`vote-${card}`] = t.dataset.val === "?" ? "?" : +t.dataset.val; render(); break;
      case "commit": {
        const vote = form[`vote-${card}`], why = (form[`why-${card}`] || "").trim(), salt = P.newSalt();
        store(voteKey(card), { vote, why, salt, sent: false });
        await post("commit", { card, hash: P.commitment(card, ROLE, vote, why, salt) });
        break;
      }
      case "draft": {
        const text = (form[`agr-${card}`] != null ? form[`agr-${card}`] : (document.getElementById(`agr-${card}`) || {}).value || "").trim();
        if (!text) { toast("Сформулируйте договорённость — или напишите «держим как есть»"); break; }
        const owner = (document.getElementById(`own-${card}`) || {}).value || "", due = (document.getElementById(`due-${card}`) || {}).value || "";
        await post("draft", { card, text, owner: owner.trim(), due: due.trim() });
        break;
      }
      case "agree": await post("agree", { card, draft: +t.dataset.draft }); break;
      case "summary_ok": await post("summary_ok"); break;
      case "close":
        await post("export", { md: P.toMarkdown(deck, S), summary: summaryData() });
        await post("close");
        break;
      case "export-md": download(`Итоги_${deck.meta.person}_${deck.meta.period}.md`.replace(/\s+/g, "-"), P.toMarkdown(deck, S)); break;
      case "export-pdf": window.print(); break;
    }
  } finally { sending = false; }
});

// автор черновика сразу с ним согласен
let autoAgreed = new Set();
async function autoAgree() {
  for (const [id, st] of Object.entries(S.cards)) {
    const last = st.drafts[st.drafts.length - 1];
    if (last && last.role === ROLE && !st.agreed[ROLE] && !autoAgreed.has(last.seq)) { autoAgreed.add(last.seq); await post("agree", { card: +id, draft: last.seq }); }
  }
}
const _onState = onState;
onState = async function () { await _onState(); if (deck) await autoAgree(); };

if (!ROLE || !TOKEN || !HALF || !ROOM) fatal("Ссылка неполная. Откройте ссылку из приглашения целиком — вместе с частью после «#».");
else { render(); poll(); }
</script>
</body>
