<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Management Poker</title>
  <desc id="d">A 1:1 format: facts from Jira on cards, two blind estimates, a reveal and a conversation about the gap.</desc>
  <defs>
    <radialGradient id="felt" cx="38%" cy="35%" r="80%">
      <stop offset="0" stop-color="#155440"/>
      <stop offset="1" stop-color="#0b2b21"/>
    </radialGradient>
    <pattern id="back" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#6c2430"/>
      <rect width="5" height="10" fill="#5a1d26"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <style>
    .ivory { fill: #f5efe0; }
    .edge { stroke: #e4dac3; }
    .ink { fill: #1f1b16; }
    .soft { fill: #8a7f6c; }
    .brass { fill: #c19a53; }
    .garnet { fill: #8f2a37; }
    .light { fill: #f5efe0; }
    .muted { fill: #b9c7bf; }
    .sans { font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
    .serif { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
  </style>

  <rect width="1200" height="360" rx="20" fill="url(#felt)"/>
  <rect x="10" y="10" width="1180" height="340" rx="14" fill="none" stroke="#c19a53" stroke-opacity=".35"/>

  <!-- Title -->
  <text class="brass serif" x="64" y="122" font-size="56" font-weight="700">Management Poker</text>
  <text class="muted serif" x="66" y="162" font-size="24">Управленческий покер</text>
  <text class="light sans" x="66" y="222" font-size="26" font-weight="600">1:1 on facts, not impressions.</text>
  <text class="light sans" x="66" y="258" font-size="26" font-weight="600">Two blind estimates. One honest talk.</text>
  <text class="muted sans" x="66" y="304" font-size="17">Jira facts · blind 1 · 2 · 3 · 5 · 8 · reveal the gap · agree the next step</text>

  <!-- Fact card -->
  <g transform="translate(660 52) rotate(-4)" filter="url(#shadow)">
    <rect class="ivory edge" width="230" height="250" rx="14"/>
    <text class="ink serif" x="20" y="46" font-size="34">♠</text>
    <rect class="ink" x="58" y="26" width="120" height="8" rx="4" opacity=".85"/>
    <rect class="soft" x="58" y="42" width="80" height="6" rx="3"/>
    <rect class="soft" x="20" y="78" width="190" height="7" rx="3.5" opacity=".7"/>
    <rect class="soft" x="20" y="96" width="176" height="7" rx="3.5" opacity=".7"/>
    <rect class="soft" x="20" y="114" width="186" height="7" rx="3.5" opacity=".7"/>
    <rect class="soft" x="20" y="132" width="120" height="7" rx="3.5" opacity=".7"/>
    <line x1="20" y1="156" x2="210" y2="156" stroke="#cdbf9f" stroke-dasharray="4 4"/>
    <rect class="brass" x="20" y="172" width="58" height="6" rx="3"/>
    <rect class="soft" x="20" y="190" width="180" height="7" rx="3.5"/>
    <rect class="soft" x="20" y="208" width="140" height="7" rx="3.5"/>
  </g>

  <!-- Estimates: revealed and face down -->
  <g transform="translate(918 70)" filter="url(#shadow)">
    <rect class="ivory edge" width="96" height="134" rx="12"/>
    <text class="ink serif" x="48" y="90" font-size="62" font-weight="700" text-anchor="middle">8</text>
  </g>
  <g transform="translate(1030 70)" filter="url(#shadow)">
    <rect class="ivory edge" width="96" height="134" rx="12"/>
    <text class="garnet serif" x="48" y="90" font-size="62" font-weight="700" text-anchor="middle">3</text>
  </g>
  <g transform="translate(990 214) rotate(6)" filter="url(#shadow)">
    <rect width="88" height="88" rx="12" fill="url(#back)" stroke="#8c7040" stroke-width="3"/>
  </g>

  <!-- Gap badge -->
  <g transform="translate(920 228)">
    <rect width="54" height="34" rx="17" fill="#0b2b21" stroke="#c19a53" stroke-width="2"/>
    <text class="brass sans" x="27" y="23" font-size="17" font-weight="700" text-anchor="middle">Δ 2</text>
  </g>
</svg>
